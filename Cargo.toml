[package]
name = "rustflow"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"
members = [
    "crates/rustflow-server",
    "crates/rustflow-common",
]

# Shared dependency versions — all crates inherit from here
[workspace.dependencies]
axum = "0.8"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
thiserror = "2.0.18"
tower = {version = "0.5", features = ["limit", "load-shed", "buffer"]}
tower-http = { version = "0.6", features = ["fs", "cors", "compression-full", "trace"]}
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["fmt", "env-filter"]}
tracing-appender = "0.2"